[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-analog-engine"
version = "2.2.0"
description = "Motor científico exploratorio Tierra-Marte con informes auditables y dashboard offline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "earthaccess>=0.10,<1.0",
    "requests>=2.31,<3.0",
    "numpy>=1.26,<3",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "scipy>=1.12,<2.0",
    "shapely>=2.0,<3.0",
    "pyshp>=2.3,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
rover = ["rasterio>=1.3,<2.0"]
landcover = ["pyhdf>=0.11.6,<0.12"]

[project.scripts]
mars-data = "mars_analog.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"mars_analog.data" = ["country_centers_v202.json", "world_land_v203.json", "rover_view_v21.js", "rover_view_v22.js"]
